name: door_radar_app
description: 현관 레이더(RETINA-4SN) + 라즈베리파이 판정 결과를 보여주는 앱
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0 # json_serializable 6.15 가 3.8 이상을 요구

# 패키지는 setup.ps1 이 `flutter pub add` 로 최신 호환 버전을 넣는다.
dependencies:
  cached_network_image: ^4.0.7
  dio: ^5.11.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  gal: ^3.0.1
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  sqflite: ^2.4.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true

  # 시연장이 오프라인일 수 있어 번들한다 (DESIGN.md). 라이선스: assets/fonts/OFL-*.txt (main 에서 LicenseRegistry 에 등록)
  # Noto Sans KR 은 와이어프레임과 같이 400/500/700 만 (600 은 가까운 굵기로 그려진다)
  assets:
    - assets/fonts/OFL-InterTight.txt
    - assets/fonts/OFL-NotoSansKR.txt
  fonts:
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-Regular.ttf
        - asset: assets/fonts/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTight-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterTight-Bold.ttf
          weight: 700
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
