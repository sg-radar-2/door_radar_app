<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFEFEE; font-family: 'Inter Tight', 'Noto Sans KR', sans-serif; color: #141414; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden">

  <h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: -1.2px">설정</h1>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #6B6B6B; padding: 0 4px">알림</span>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 4px 18px">
      <sc-for list="{{alerts}}" as="al" hint-placeholder-count="3">
        <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: {{al.line}}">
          <span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{alert}}"></span>{{al.name}}</span>
          <button type="button" role="switch" aria-checked="{{al.checked}}" aria-label="{{al.name}} 알림" onClick="{{al.toggle}}" style="width: 48px; height: 28px; border-radius: 14px; border: none; padding: 3px; box-sizing: border-box; display: flex; cursor: pointer; {{al.track}}">
            <span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span>
          </button>
        </div>
      </sc-for>
    </div>
    
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #6B6B6B; padding: 0 4px">촬영 · 보관</span>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 4px 18px">
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EFEFEE">
        <span style="font-size: 15px; font-weight: 500">이상 상황 촬영</span>
        <button type="button" role="switch" aria-checked="{{camChecked}}" aria-label="이상 상황 촬영" onClick="{{toggleCam}}" style="width: 48px; height: 28px; border-radius: 14px; border: none; padding: 3px; box-sizing: border-box; display: flex; cursor: pointer; {{camTrack}}">
          <span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span>
        </button>
      </div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EFEFEE">
        <span style="font-size: 15px; font-weight: 500">촬영 기준</span>
        <span style="font-size: 14px; color: #6B6B6B">60% 이상 · 1초 유지</span>
      </div>
      <div style="padding: 12px 0 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <label for="keepDays" style="font-size: 15px; font-weight: 500">휴대폰 보관 기간</label>
          <span style="height: 36px; border-radius: 18px; background: #EFEFEE; display: flex; align-items: center; gap: 4px; padding: 0 14px 0 6px; box-sizing: border-box; {{daysBorder}}">
            <input id="keepDays" type="number" inputmode="numeric" min="7" max="730" step="1" value="{{daysInput}}" onInput="{{typeDays}}" onBlur="{{fixDays}}" aria-describedby="keepDaysHint" style="width: 56px; height: 28px; border: none; border-radius: 14px; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 14px; font-weight: 600; color: #141414; outline: none; padding: 0">
            <span style="font-size: 14px; font-weight: 500">일</span>
          </span>
        </div>
        
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #6B6B6B; padding: 0 4px">기기</span>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 4px 18px">
      <a href="Device.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EFEFEE; text-decoration: none; color: #141414">
        <span style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 500">기기 상태</span>
          <span style="font-size: 12px; color: #6B6B6B">doorradar.local · 정상</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"></path></svg>
      </a>
      <a href="Main.dc.html" style="height: 52px; display: flex; align-items: center; text-decoration: none; color: {{alert}}; font-size: 15px; font-weight: 500">연결 해제</a>
    </div>
  </div>

  <nav aria-label="하단 탭" style="position: absolute; left: 20px; right: 20px; bottom: 20px; height: 64px; border-radius: 32px; background: #FFFFFF; border: 1px solid #E2E2E0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <a href="Home.dc.html" style="height: 48px; border-radius: 24px; color: #6B6B6B; display: flex; align-items: center; gap: 8px; padding: 0 18px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>홈
    </a>
    <a href="Events.dc.html" style="height: 48px; border-radius: 24px; color: #6B6B6B; display: flex; align-items: center; gap: 8px; padding: 0 18px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>기록
    </a>
    <a href="Settings.dc.html" aria-current="page" style="height: 48px; border-radius: 24px; background: #141414; color: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 20px; text-decoration: none; font-size: 14px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>설정
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"alert":{"editor":"color","default":"#D4381C","options":["#D4381C","#E06A12","#B4234A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { dwell: true, loiter: true, repeat: true }, cam: true, days: 300 };
  }
  renderVals() {
    const onTrack = 'background: #141414; justify-content: flex-end;';
    const offTrack = 'background: #D6D6D4; justify-content: flex-start;';
    const items = [
      { key: 'dwell', name: '장시간 체류' },
      { key: 'loiter', name: '배회' },
      { key: 'repeat', name: '반복 접근' }
    ];
    const alerts = items.map((it, i) => {
      const v = this.state.on[it.key];
      return {
        name: it.name,
        checked: v ? 'true' : 'false',
        track: v ? onTrack : offTrack,
        line: i < items.length - 1 ? '1px solid #EFEFEE' : 'none',
        toggle: () => this.setState({ on: { ...this.state.on, [it.key]: !v } })
      };
    });
    const MIN = 7, MAX = 730;
    const raw = this.state.daysInput ?? String(this.state.days);
    const n = Number(raw);
    const valid = raw !== '' && Number.isInteger(n) && n >= MIN && n <= MAX;
    return {
      alert: this.props.alert ?? '#D4381C',
      alerts,
      camChecked: this.state.cam ? 'true' : 'false',
      camTrack: this.state.cam ? onTrack : offTrack,
      toggleCam: () => this.setState({ cam: !this.state.cam }),
      daysInput: raw,
      daysBorder: valid ? 'border: 1.5px solid transparent;' : 'border: 1.5px solid ' + (this.props.alert ?? '#D4381C') + ';',
      hint: valid ? '이 폰에 7~730일 · 기기에는 30일만 임시 보관' : '7부터 730 사이의 정수로 입력해 주세요',
      hintColor: valid ? '#6B6B6B' : (this.props.alert ?? '#D4381C'),
      typeDays: (e) => this.setState({ daysInput: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
      fixDays: () => {
        const v = Number(this.state.daysInput);
        const days = Number.isFinite(v) && this.state.daysInput !== '' ? Math.min(MAX, Math.max(MIN, Math.round(v))) : this.state.days;
        this.setState({ days, daysInput: String(days) });
      }
    };
  }
}
</script>
</body>
</html>
