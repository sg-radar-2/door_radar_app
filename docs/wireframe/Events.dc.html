<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFEFEE; font-family: 'Inter Tight', 'Noto Sans KR', sans-serif; color: #141414; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: -1.2px">기록</h1>
    <span style="height: 36px; border-radius: 18px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500">
      11월 19일
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </span>
  </div>

  <div role="tablist" aria-label="기록 필터" style="height: 44px; border-radius: 22px; background: #E3E3E1; padding: 4px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
    <button type="button" role="tab" aria-selected="{{allSelected}}" onClick="{{showAll}}" style="border: none; border-radius: 18px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; {{allStyle}}">전체</button>
    <button type="button" role="tab" aria-selected="{{abnSelected}}" onClick="{{showAbn}}" style="border: none; border-radius: 18px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; {{abnStyle}}">이상만</button>
  </div>

  <div style="background: #141414; color: #FFFFFF; border-radius: 14px; padding: 16px 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A3A3A3">오늘 전체</span><span style="font-size: 22px; font-weight: 600">6</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A3A3A3">이상</span><span style="font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{alert}}"></span>2</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A3A3A3">촬영</span><span style="font-size: 22px; font-weight: 600">2</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #6B6B6B; padding: 0 4px">오늘</span>
    <sc-for list="{{events}}" as="ev" hint-placeholder-count="6">
      <a href="EventDetail.dc.html" style="height: 64px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 8px; text-decoration: none; color: #141414">
        <sc-if value="{{ev.abnormal}}" hint-placeholder-val="{{false}}">
          <span style="width: 48px; height: 48px; border-radius: 16px; background: #2A2A2A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.5-2h5.6l1.5 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          </span>
        </sc-if>
        <sc-if value="{{ev.normal}}" hint-placeholder-val="{{true}}">
          <span style="width: 48px; height: 48px; border-radius: 16px; background: #EFEFEE; color: #6B6B6B; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16"></path><circle cx="14.5" cy="12" r="0.9" fill="currentColor" stroke="none"></circle></svg>
          </span>
        </sc-if>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600">
            {{ev.name}}
            <sc-if value="{{ev.abnormal}}" hint-placeholder-val="{{false}}">
              <span style="height: 20px; border-radius: 10px; background: {{alert}}; color: #FFFFFF; padding: 0 8px; display: flex; align-items: center; font-size: 11px; font-weight: 600">이상</span>
            </sc-if>
          </span>
          <span style="font-size: 12px; color: #6B6B6B">{{ev.time}} · {{ev.meta}}</span>
        </span>
        <span style="font-size: 13px; font-weight: 600">{{ev.prob}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </div>

  <nav aria-label="하단 탭" style="position: absolute; left: 20px; right: 20px; bottom: 20px; height: 64px; border-radius: 32px; background: #FFFFFF; border: 1px solid #E2E2E0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <a href="Home.dc.html" style="height: 48px; border-radius: 24px; color: #6B6B6B; display: flex; align-items: center; gap: 8px; padding: 0 18px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>홈
    </a>
    <a href="Events.dc.html" aria-current="page" style="height: 48px; border-radius: 24px; background: #141414; color: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 20px; text-decoration: none; font-size: 14px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>기록
    </a>
    <a href="Settings.dc.html" style="height: 48px; border-radius: 24px; color: #6B6B6B; display: flex; align-items: center; gap: 8px; padding: 0 18px; text-decoration: none; font-size: 14px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>설정
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"alert":{"editor":"color","default":"#D4381C","options":["#D4381C","#E06A12","#B4234A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const all = [
      { time: '15:03', name: '장시간 체류', meta: '1분 23초 · 촬영', prob: '100%', abnormal: true },
      { time: '14:41', name: '배달', meta: '외곽으로 나감', prob: '93%', abnormal: false },
      { time: '13:20', name: '귀가', meta: '문으로 들어감', prob: '97%', abnormal: false },
      { time: '11:58', name: '반복 접근', meta: '60초에 3번 · 촬영', prob: '100%', abnormal: true },
      { time: '09:12', name: '외출', meta: '문에서 나옴', prob: '93%', abnormal: false },
      { time: '08:47', name: '통과', meta: '문 앞을 지나감', prob: '98%', abnormal: false }
    ].map((e) => ({ ...e, normal: !e.abnormal }));
    const isAll = this.state.filter === 'all';
    const on = 'background: #FFFFFF; color: #141414;';
    const off = 'background: transparent; color: #6B6B6B;';
    return {
      alert: this.props.alert ?? '#D4381C',
      events: isAll ? all : all.filter((e) => e.abnormal),
      allSelected: isAll ? 'true' : 'false',
      abnSelected: isAll ? 'false' : 'true',
      allStyle: isAll ? on : off,
      abnStyle: isAll ? off : on,
      showAll: () => this.setState({ filter: 'all' }),
      showAbn: () => this.setState({ filter: 'abnormal' })
    };
  }
}
</script>
</body>
</html>
