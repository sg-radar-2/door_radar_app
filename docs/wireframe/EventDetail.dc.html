<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이벤트 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFEFEE; font-family: 'Inter Tight', 'Noto Sans KR', sans-serif; color: #141414; padding: 24px 20px 24px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Events.dc.html" aria-label="뒤로" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #141414; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 13px; color: #6B6B6B">11월 19일 · T3+7</span>
    <button type="button" aria-label="갤러리에 저장" title="갤러리에 저장" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #141414; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
    </button>
  </div>

  <div style="height: 210px; border-radius: 28px; background: #1E1E1E; position: relative; display: flex; align-items: center; justify-content: center; color: #8A8A8A">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.5-2h5.6l1.5 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      <span style="font-size: 12px">촬영 사진 (적외선, 흑백)</span>
    </div>
    <span style="position: absolute; left: 14px; top: 14px; height: 26px; border-radius: 13px; background: rgba(255,255,255,0.92); color: #141414; padding: 0 10px; display: flex; align-items: center; font-size: 12px; font-weight: 600">15:03:10</span>
    <span style="position: absolute; right: 14px; bottom: 14px; height: 26px; border-radius: 13px; background: rgba(20,20,20,0.85); color: #FFFFFF; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-size: 12px"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{point}}"></span>이 폰에 저장됨</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="height: 24px; border-radius: 12px; background: {{alert}}; color: #FFFFFF; padding: 0 10px; display: flex; align-items: center; font-size: 12px; font-weight: 600">이상</span>
      <span style="font-size: 12px; color: #6B6B6B">15:02:17 – 15:03:40 · 1분 23초</span>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -1px">장시간 체류</h1>
      <span style="font-size: 30px; font-weight: 600; letter-spacing: -1px">100<span style="font-size: 16px">%</span></span>
    </div>
    <span style="font-size: 13px; color: #6B6B6B">외곽에서 들어옴 (2.4m) → 문으로 사라짐 (0.5m)</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 600">나온 행동</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="height: 32px; border-radius: 16px; background: #141414; color: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{alert}}"></span>장시간 체류 100%</span>
      <span style="height: 32px; border-radius: 16px; background: #EFEFEE; color: #141414; padding: 0 14px; display: flex; align-items: center; font-size: 13px; font-weight: 500">방문 94% · 끝날 때</span>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 20px; color: #6B6B6B">이상 행동 우선: 진행 중 장시간 체류 100%가 15초부터 이어져서, 끝날 때 판정 방문 94% 대신 장시간 체류로 판정했어요.</p>
  </div>

  <div style="margin-top: auto; background: #FFFFFF; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
      <span style="font-size: 15px; font-weight: 600">판정이 맞나요?</span>
      <span style="font-size: 12px; line-height: 17px; color: #6B6B6B">알려주시면 다음 학습 데이터로 저장돼요.</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" onClick="{{confirm}}" style="height: 48px; border-radius: 24px; background: #141414; color: #FFFFFF; border: none; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">맞아요</button>
        <button type="button" onClick="{{confirm}}" style="height: 48px; border-radius: 24px; background: #FFFFFF; color: #141414; border: 1px solid #141414; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">다른 상황이에요</button>
      </div>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #141414; color: {{point}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <span style="font-size: 15px; font-weight: 600">정답으로 저장했어요</span>
          <span style="font-size: 12px; color: #6B6B6B">labels.csv로 내보낼 수 있어요</span>
        </span>
        <button type="button" onClick="{{undo}}" style="height: 36px; border-radius: 18px; background: #EFEFEE; color: #141414; border: none; padding: 0 14px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">되돌리기</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"point":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#7DD3FC","#FFFFFF"]},"alert":{"editor":"color","default":"#D4381C","options":["#D4381C","#E06A12","#B4234A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: false };
  }
  renderVals() {
    return {
      point: this.props.point ?? '#C6F24E',
      alert: this.props.alert ?? '#D4381C',
      asking: !this.state.done,
      done: this.state.done,
      confirm: () => this.setState({ done: true }),
      undo: () => this.setState({ done: false })
    };
  }
}
</script>
</body>
</html>
