      <path d="M13 222 A140 140 0 0 1 293 222" fill="none" stroke="#2C2C2C"></path>
      <path d="M153 222 L293 164 M153 222 L13 164" stroke="#3A3A3A"></path>

      <polyline points="281,70 252,86 230,104 214,112 206,120" fill="none" stroke="{{alert}}" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"></polyline>
      <circle cx="206" cy="120" r="22" fill="{{alert}}" fill-opacity="0.16"></circle>
      <circle cx="206" cy="120" r="7" fill="{{alert}}"></circle>
      <rect x="64" y="108" width="122" height="24" rx="12" fill="#FFFFFF"></rect>
      <text x="125" y="124" font-size="11" font-weight="600" fill="#141414" text-anchor="middle" font-family="Inter Tight, Noto Sans KR">장시간 체류 · 36초</text>
      <rect x="138" y="219" width="30" height="7" rx="3.5" fill="#FFFFFF"></rect>
      <text x="153" y="214" font-size="10" fill="#A3A3A3" text-anchor="middle" font-family="Noto Sans KR">문</text>
    </svg>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; color: #6B6B6B">이번 30분 안의 머무름</span>
      <span style="font-size: 15px; font-weight: 600">1회째 · 2회부터 알림</span>
    </div>
    <span style="height: 28px; border-radius: 14px; background: #EFEFEE; padding: 0 12px; display: flex; align-items: center; font-size: 12px; font-weight: 500">촬영함</span>
  </div>

  <nav aria-label="하단 탭" style="position: absolute; left: 20px; right: 20px; bottom: 20px; height: 64px; border-radius: 32px; background: #FFFFFF; border: 1px solid #E2E2E0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <a href="Home.dc.html" aria-current="page" style="height: 48px; border-radius: 24px; background: #141414; color: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 20px; text-decoration: none; font-size: 14px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>홈

    <a href="Settings.dc.html" style="height: 48px; border-radius: 24px; color: #6B6B6B; display: flex; align-items: center; gap: 8px; padding: 0 18px; text-decoration: none; font-size: 14px; font-weight: 500">

<script type="text/x-dc" data-dc-script data-props='{"point":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#7DD3FC","#FFFFFF"]},"alert":{"editor":"color","default":"#D4381C","options":["#D4381C","#E06A12","#B4234A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { point: this.props.point ?? '#C6F24E', alert: this.props.alert ?? '#D4381C' };
  }
}
</script>
