<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기기 상태</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFEFEE; font-family: 'Inter Tight', 'Noto Sans KR', sans-serif; color: #141414; padding: 24px 20px 24px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Settings.dc.html" aria-label="뒤로" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #141414; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.9px">기기 상태</h1>
  </div>

  <div style="background: #141414; color: #FFFFFF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{point}}"></span>정상 작동 중</span>
      <span style="font-size: 12px; color: #A3A3A3">3일 4시간째 켜짐</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 24px; font-weight: 600; letter-spacing: -0.6px">doorradar.local</span>
      <span style="font-size: 13px; color: #A3A3A3">Raspberry Pi 4 · 192.168.0.10 · 공유기 Wi-Fi</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid #2C2C2C; padding-top: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A3A3A3">프레임</span><span style="font-size: 16px; font-weight: 600">10 fps</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A3A3A3">지연</span><span style="font-size: 16px; font-weight: 600">0.4초</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #A3A3A3">CPU 온도</span><span style="font-size: 16px; font-weight: 600">52°C</span></div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #EFEFEE; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #6B6B6B">레이더</span>
        <span style="font-size: 15px; font-weight: 600">연결됨</span>
        <span style="font-size: 12px; color: #6B6B6B">RETINA-4SN · .0.20</span>
      </span>
    </div>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #EFEFEE; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.5-2h5.6l1.5 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #6B6B6B">카메라</span>
        <span style="font-size: 15px; font-weight: 600">대기 중</span>
        <span style="font-size: 12px; color: #6B6B6B">Wide NoIR · IR LED 자동</span>
      </span>
    </div>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #EFEFEE; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="18" r="2"></circle><path d="M12 7v4M12 11l-5 5M12 11l5 5"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #6B6B6B">판정 모델</span>
        <span style="font-size: 15px; font-weight: 600">model v5</span>
        <span style="font-size: 12px; color: #6B6B6B">situation_trees_1111</span>
      </span>
    </div>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 12px; color: #6B6B6B">저장 공간</span>
        <span style="font-size: 12px; color: #6B6B6B">사진 38장</span>
      </span>
      <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.5px">1.2<span style="font-size: 13px; font-weight: 500; color: #6B6B6B"> / 29 GB</span></span>
      <div style="height: 6px; border-radius: 3px; background: #EFEFEE"><div style="width: 5%; height: 6px; border-radius: 3px; background: #141414"></div></div>
      <span style="font-size: 12px; line-height: 16px; color: #6B6B6B">30일 임시 보관 · 폰 전송 대기 0장</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button type="button" onClick="{{reconnect}}" style="height: 56px; border-radius: 28px; background: #FFFFFF; color: #141414; border: 1px solid #141414; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{reconnectLabel}}</button>
    <a href="Main.dc.html" style="height: 56px; border-radius: 28px; background: #141414; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">다른 기기 연결</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"point":{"editor":"color","default":"#C6F24E","options":["#C6F24E","#7DD3FC","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { busy: false };
  }
  renderVals() {
    return {
      point: this.props.point ?? '#C6F24E',
      reconnectLabel: this.state.busy ? '다시 연결하는 중…' : '레이더 다시 연결',
      reconnect: () => {
        this.setState({ busy: true });
        setTimeout(() => this.setState({ busy: false }), 1500);
      }
    };
  }
}
</script>
</body>
</html>
